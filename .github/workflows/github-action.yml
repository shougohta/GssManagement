name: Run rspec, rubocop

on:
  push:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.3

      - name: Bundler and gem install
        run: |
          cd gss_management
          gem install bundler
          bundle install --jobs 4 --retry 3

  rspec:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Yarn install
        run: |
          cd gss_management
          yarn install --check-files

      - name: Database create and migrate
        run: |
          cd gss_management
          bundle exec rails db:create RAILS_ENV=test
          bundle exec rails db:migrate RAILS_ENV=test

      - name: Run rspec
        run: |
          cd gss_management
          bundle exec rspec

  rubocop:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run rubocop
        run: |
          cd gss_management
          bundle exec rubocop
